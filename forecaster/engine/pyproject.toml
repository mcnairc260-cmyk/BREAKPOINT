[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "forecaster"
version = "0.1.0"
description = "Short-horizon crypto probability forecaster — calibrated P(price > target)."
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "scipy>=1.11",
    "scikit-learn>=1.4",
    "lightgbm>=4.3",
    "sqlalchemy>=2.0",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "pydantic>=2.6",
    "httpx>=0.27",
    "websockets>=12.0",
    "joblib>=1.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    # Not optional in practice: `addopts` below passes --disable-socket, so
    # without this pytest aborts on an unrecognised argument before it collects
    # a single test, and mypy cannot resolve the import in cli/verify.py.
    "pytest-socket>=0.7",
    "ruff>=0.4",
    "mypy>=1.9",
]

[project.scripts]
forecaster = "forecaster.cli.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
# B008: FastAPI's dependency injection is built on calls in argument defaults.
# RUF002: docstrings use the real minus sign and sigma deliberately — those
#   characters reach the user in "−$25.73" and "1.4σ", so the prose matches the
#   interface rather than approximating it with a hyphen.
ignore = ["B008", "RUF002"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
# `tests` has no __init__.py, so pytest puts tests/ on sys.path rather than the
# root. The leakage canary imports `tests.conftest`, so under the `pytest`
# console script it fails to import while `python -m pytest` -- which CI runs,
# and which adds the working directory -- passes. The canary is the check the
# whole design exists to pass; it must not look broken to whoever runs it the
# other way, because the tempting repair for a broken canary is to delete it.
pythonpath = ["."]
# Network access is blocked for the whole suite. Unix sockets stay open because
# asyncio builds its event loop from a socketpair; blocking those would fail
# every async test for a reason unrelated to the network.
#
# This does double duty. It keeps the tests hermetic, and it proves the exchange
# adapter fixtures really are fixtures — if any of that code could reach a venue,
# these tests would fail rather than quietly passing for the wrong reason.
addopts = "--disable-socket --allow-unix-socket"
filterwarnings = ["error::DeprecationWarning:forecaster.*"]

[tool.mypy]
python_version = "3.11"
packages = ["forecaster"]
mypy_path = "src"
strict = true
warn_unreachable = true
disallow_untyped_defs = true
# NumPy's own stubs return `Any` from most reductions (`np.mean`, `np.sum`,
# `np.quantile`), and SQLAlchemy Core rows are `Any` by construction. Under
# `strict` that produces a stream of "returning Any" and "argument has type Any"
# reports that say nothing about correctness — every one is a float coming back
# from a numeric library. Turning these two off keeps the remaining output
# meaningful; every other strict check stays on, including the ones that catch
# genuine mistakes (missing annotations, unreachable code, unused ignores).
warn_return_any = false
disallow_any_explicit = false

[[tool.mypy.overrides]]
module = ["lightgbm.*", "sklearn.*", "scipy.*", "joblib.*"]
ignore_missing_imports = true

# The persistence and service layers hand `Any` around because that is what
# SQLAlchemy Core rows and FastAPI request bodies genuinely are. The domain
# layers below them — types, features, models, labels, validation, calibration —
# stay fully strict, which is where a type error would actually cost something.
[[tool.mypy.overrides]]
module = ["forecaster.store.*", "forecaster.service.*", "forecaster.cli.*"]
disallow_any_generics = false
warn_unused_ignores = false
