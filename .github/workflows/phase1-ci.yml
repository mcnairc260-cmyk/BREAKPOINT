# BREAKPOINT Phase 1 CI.
#
# Every gate a contributor runs locally, plus the browser acceptance suite —
# which is a required gate, not an optional extra. A physics engine whose
# guarantees (determinism, no energy created, no ball escaping the table) are
# only checked by hand is a physics engine whose guarantees decay, and a game
# that passes its unit tests can still ship a blank screen.
name: Phase 1 CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]

concurrency:
  group: phase1-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      # `ci`, not `install`: the lockfile is the point. Silent dependency drift
      # is exactly the thing that makes a physics regression look like a code
      # regression.
      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit and physics tests
        run: npm test

      - name: Production build
        run: npm run build

      # Only Chromium: the acceptance suite runs against software-rendered
      # WebGL, and a second engine would double the slowest job in CI without
      # testing anything the first does not.
      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium

      # Runs against the built application from the previous step, served by
      # `vite preview` — the thing shipped is the thing verified.
      - name: Browser acceptance tests
        run: npm run e2e

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
          if-no-files-found: ignore
