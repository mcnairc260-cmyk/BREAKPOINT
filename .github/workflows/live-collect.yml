# The track record: consecutive bounded runs, assembled into days of evidence.
#
# The live proof answered "does this work on a real market" in 72 minutes. This
# answers the separate and much harder question — "are the probabilities any
# good" — and it cannot be answered quickly, because the honest unit of evidence
# is the non-overlapping observation and there are only 288 five-minute and 72
# twenty-minute ones in a day per symbol.
#
#   5-minute model:  750 independent observations ≈ 3-4 days
#   20-minute model: 750 independent observations ≈ 14 days
#
# A GitHub job stops at six hours, so this runs every six and resumes from the
# database it committed last time. Three details make that work:
#
#   * Each segment stops *sampling* twenty minutes before it stops *collecting*,
#     so every forecast it starts also expires inside the same segment. Without
#     that, each run would end with a tail of forecasts that can never resolve
#     and would be scored VOID for reasons that have nothing to do with the
#     market.
#   * Each segment then drops its raw ticks and keeps only predictions and
#     outcomes. A resolved outcome already stores the price it was scored at, so
#     deleting the feed cannot alter a recorded result — and it takes the
#     database from megabytes to kilobytes.
#   * The hash chain spans segments. Predictions accumulate in one append-only
#     log across the whole collection, and `verify_chain` covers all of it.
#
# Nothing here trains or tunes anything. The learner stays quarantined behind its
# 750-observation threshold, and the first live sample is evidence, not a tuning
# set.
name: Live collection

on:
  schedule:
    # Every six hours, at 23 minutes past rather than on the hour. GitHub queues
    # every cron in the world at minute 0 and drops scheduled runs it cannot
    # place under load -- which is what happened to the 06:00 run on the first
    # day: the workflow was active, and no run was created at all, not even a
    # queued one. An odd minute is the documented way to avoid that peak.
    #
    # Scheduled workflows run only from the default branch, and GitHub disables
    # them after 60 days without repository activity.
    #
    # A dropped run still costs a segment, so treat the schedule as best effort:
    # `Live collection` can always be dispatched by hand, and the concurrency
    # group makes an extra run queue rather than collide.
    - cron: '23 */6 * * *'
  workflow_dispatch:
    inputs:
      venue:
        description: 'Exchange (blank = probe and pick the first that answers)'
        required: false
        default: 'coinbase'
        type: choice
        options: ['', 'coinbase', 'kraken', 'binance', 'binance.us']
      minutes:
        description: 'Collection length in minutes (320 fits inside the 6-hour cadence)'
        required: false
        default: '320'
        type: string
      ref:
        description: 'Branch holding the forecaster and its track record'
        required: false
        default: 'claude/crypto-probability-forecaster-f3qhmn'
        type: string

concurrency:
  # Never two collectors on one database. A late run waits rather than racing.
  group: live-collect
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  collect:
    name: Collect live market data
    runs-on: ubuntu-latest
    timeout-minutes: 350
    defaults:
      run:
        shell: bash
        working-directory: forecaster/engine

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || 'claude/crypto-probability-forecaster-f3qhmn' }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install the engine
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install -e .

      # The track record travels in the repository. First run starts empty.
      - name: Carry the track record forward
        env:
          FORECASTER_DB: sqlite:///../evidence/live.db
        run: |
          set -euo pipefail
          mkdir -p ../evidence
          if [ -f ../evidence/live.db ]; then
            SIZE=$(du -h ../evidence/live.db | cut -f1)
            echo "resuming from an existing track record ($SIZE)"
            forecaster live-status || true
          else
            echo "no track record yet; this is the first segment"
          fi

      - name: Collect
        id: collect
        env:
          FORECASTER_DB: sqlite:///../evidence/live.db
          FORECASTER_PROVIDER: live
          FORECASTER_VENUE: ${{ inputs.venue || 'coinbase' }}
        run: |
          set -euo pipefail
          MINUTES="${{ inputs.minutes || '320' }}"
          SECONDS_TO_RUN=$(( MINUTES * 60 ))
          echo "collecting for ${MINUTES} minutes"
          set +e
          forecaster collect-live --seconds "$SECONDS_TO_RUN" | tee collect.txt
          echo "status=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"
          set -e
          { echo '## Collection'; echo '```'; tail -30 collect.txt; echo '```'; } \
            >> "$GITHUB_STEP_SUMMARY"

      # Everything this segment started has expired by now, so the ticks have
      # done their job. Refuses to run if anything is still open.
      - name: Drop the ticks, keep the evidence
        if: ${{ !cancelled() }}
        env:
          FORECASTER_DB: sqlite:///../evidence/live.db
        run: |
          set -euo pipefail
          forecaster evaluate || true
          forecaster compact --data-source live --vacuum

      - name: Report
        if: ${{ !cancelled() }}
        env:
          FORECASTER_DB: sqlite:///../evidence/live.db
        run: |
          set -euo pipefail
          mkdir -p ../reports
          forecaster live-report --json ../reports/live-validation.json | tee report.txt
          forecaster live-status --json > ../reports/live-status.json || true
          { echo '## Track record so far'; echo '```'; cat report.txt; echo '```'; } \
            >> "$GITHUB_STEP_SUMMARY"

      - name: Commit the segment
        if: ${{ !cancelled() }}
        working-directory: .
        run: |
          set -euo pipefail
          REF="${{ inputs.ref || 'claude/crypto-probability-forecaster-f3qhmn' }}"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          # -f because *.db is git-ignored for local work, where a database is one
          # person's scratch. Here it is the track record itself.
          git add -f forecaster/evidence/live.db || true
          git add -f forecaster/reports/live-validation.json forecaster/reports/live-status.json || true
          if git diff --cached --quiet; then
            echo "nothing changed; not committing"
            exit 0
          fi
          OBS=$(python -c "
          import json
          try:
              d = json.load(open('forecaster/reports/live-status.json'))
              rows = d.get('per_horizon_progress', [])
              print(' '.join(f\"{r['symbol'].split('-')[0]}{r['horizon_s']//60}m={r['independent_observations']}\" for r in rows))
          except Exception:
              print('counts unavailable')
          ")

          # Replant onto the branch tip rather than rebase onto it. A rebase that
          # meets a changed binary database stops on a conflict no merge driver
          # can resolve and leaves the repository mid-rebase -- and the retry
          # loop then retries straight back into that wedge, so five hours of
          # collection is lost to a file nobody else edits. These three paths
          # have exactly one author, this job, so replacing them wholesale on
          # top of whatever the branch tip is now is both correct and incapable
          # of conflicting. Any unrelated commit pushed during the run survives,
          # because the reset lands on it.
          KEEP=$(mktemp -d)
          cp forecaster/evidence/live.db "$KEEP/" 2>/dev/null || true
          cp forecaster/reports/live-validation.json "$KEEP/" 2>/dev/null || true
          cp forecaster/reports/live-status.json "$KEEP/" 2>/dev/null || true

          pushed=no
          for attempt in 1 2 3 4; do
            git fetch origin "$REF" || { sleep $((attempt * 5)); continue; }
            git reset --hard "origin/$REF"
            mkdir -p forecaster/evidence forecaster/reports
            cp "$KEEP/live.db" forecaster/evidence/ 2>/dev/null || true
            cp "$KEEP"/live-*.json forecaster/reports/ 2>/dev/null || true
            git add -f forecaster/evidence/live.db || true
            git add -f forecaster/reports/live-validation.json forecaster/reports/live-status.json || true
            if git diff --cached --quiet; then
              echo "the branch already carries this segment; nothing to push"
              pushed=yes
              break
            fi
            git commit -m "Live collection segment ${{ github.run_number }}" \
                       -m "Independent observations: $OBS"
            if git push origin HEAD:"$REF"; then
              pushed=yes
              break
            fi
            # Rejected or a network fault: undo the local commit and try the
            # whole cycle again against the new tip.
            git reset --soft HEAD~1
            sleep $((attempt * 5))
          done
          if [ "$pushed" != yes ]; then
            echo "could not push the segment after four attempts"
            exit 1
          fi
          echo "committed segment ${{ github.run_number }}: $OBS"

      # Growth is quadratic: git stores a whole new copy of the database every
      # segment, and the database itself grows. Measured on a full segment --
      # 876 prediction rows, 1,213 bytes each, compressing about 7.4x -- the
      # fifty-four segments that reach 750 independent twenty-minute
      # observations cost roughly 200 MiB of git objects. That is the price of
      # the goal and it is worth paying. Simply leaving the schedule on is not:
      # the same arithmetic reaches about 1 GiB at thirty days and 8.7 GiB at
      # ninety, which would wreck the repository. This never blocks a commit --
      # evidence is already pushed by the time it runs -- it just makes sure
      # nobody finds out by surprise.
      - name: Warn before the track record outgrows the repository
        if: ${{ !cancelled() }}
        working-directory: .
        run: |
          set -euo pipefail
          test -f forecaster/evidence/live.db || exit 0
          BYTES=$(stat -c%s forecaster/evidence/live.db)
          MIB=$(( BYTES / 1048576 ))
          echo "track record: ${MIB} MiB"
          if [ "$MIB" -lt 64 ]; then
            exit 0
          fi
          {
            echo "## The track record is getting large"
            echo
            echo "The database is **${MIB} MiB**. Git keeps a full copy per segment, so"
            echo "the cost of continuing grows with every run."
            echo
            echo "The 750-observation goal needs about 54 segments and about 200 MiB."
            echo "Past that, collecting for its own sake is not free."
            echo
            echo "Options, cheapest first:"
            echo "* turn the schedule off -- the evidence collected is already committed;"
            echo "* keep collecting but stop committing the database, publishing only the"
            echo "  two report files;"
            echo "* move the database out of git."
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$MIB" -ge 192 ]; then
            echo "::error::The track record is ${MIB} MiB. This segment is committed and safe, but the schedule should be turned off or the database moved out of git."
            exit 1
          fi
          echo "::warning::The track record is ${MIB} MiB and grows with every segment."

      - name: Fail if collection failed
        if: ${{ steps.collect.outputs.status != '0' }}
        run: |
          set -euo pipefail
          echo "The collector exited non-zero. The segment's evidence, if any, is committed."
          exit 1
